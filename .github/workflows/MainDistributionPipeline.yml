name: Extension Distribution Pipeline (main)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-build-next:
    name: Build extension binaries (main)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: adbc
      skip_tests: true

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: adbc
      format_checks: 'format;tidy'

  test:
    name: Test ${{ matrix.duckdb_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        duckdb_version: [main]
        include:
          - os: ubuntu-latest
            arch: linux_amd64
          - os: macos-latest
            arch: osx_arm64
          - os: windows-latest
            arch: windows_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
      - uses: columnar-tech/setup-dbc@v1
      - name: Install ADBC Drivers
        run: |
          dbc install sqlite
          dbc install datafusion

      # Windows: build with MSVC. Without this, CMake picks MinGW GCC from PATH
      # (it prefers gcc over cl), and a MinGW release build of DuckDB crashes at
      # startup (DuckCatalog::CreateSchema, 0xC0000005).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb_version }}
        run: GEN=ninja make release

      - name: Build (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb_version }}
          CC: cl
          CXX: cl
        run: GEN=ninja make release

      - name: Verify Windows compiler is MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = Select-String -Path .\build\release\CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:[A-Z]+=(.+)$'
          $cxx = $line.Matches[0].Groups[1].Value
          "CXX compiler used: $cxx"
          if ($cxx -notmatch 'cl(\.exe)?$') {
            Write-Error "Expected MSVC (cl.exe) but the build used: $cxx"
            exit 1
          }

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export ADBC_DRIVER_PATH="$HOME/Library/Application Support/ADBC/Drivers"
          else
            export ADBC_DRIVER_PATH="$HOME/.config/adbc/drivers"
          fi
          python3 ./duckdb/scripts/ci/run_tests.py ./build/release/test/unittest "test/*" --workers=1

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # dbc installs Windows drivers under %APPDATA% (Roaming)
          $env:ADBC_DRIVER_PATH = "$env:APPDATA\ADBC\Drivers"
          & .\build\release\test\unittest.exe test\

  deploy-main:
    name: Deploy extension binaries (main)
    needs: [duckdb-build-next, test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: adbc
